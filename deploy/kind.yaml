# The throwaway cluster CI makes for exhibit 11 (ci.yml, job cluster). One node. The shop's NodePort
# is mapped to the runner's 127.0.0.1:8080, so CI reaches the shop through its Kubernetes Service,
# with no Ingress controller to install.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        listenAddress: "127.0.0.1"
        protocol: TCP
