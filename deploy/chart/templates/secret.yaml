# The in-cluster database's URL and password. A Secret even though the database is a throwaway, so
# the shop reads it the way it reads production's.
apiVersion: v1
kind: Secret
metadata:
  name: shop-database
  labels:
    {{- include "shop.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.database.url | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
