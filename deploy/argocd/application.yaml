# Argo CD's Application for the shop: the Helm chart in deploy/chart, synced into the namespace
# "shop" and kept there. CI sets targetRevision and image.tag to the commit it built (ci.yml, job
# cluster), so what Argo CD reads from GitHub and the images it runs come from the same commit.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sally-manders
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/SKMinWoo/sally-manders-coffee.git
    targetRevision: main
    path: deploy/chart
    helm:
      parameters:
        - { name: image.tag, value: main }
  destination:
    server: https://kubernetes.default.svc
    namespace: shop
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff: { duration: 10s, factor: 2, maxDuration: 1m }
