<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The five mascots</title>
<link rel="stylesheet" href="kit.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Jost:wght@400;500&display=swap">
<style>
  body { background: #F4EEE2; color: #2A2420; font: 400 16px/1.5 Jost, system-ui, sans-serif; padding: 48px clamp(20px, 5vw, 64px) 72px; }
  h1 { font: 600 clamp(30px, 4vw, 46px)/1.05 Fraunces, serif; letter-spacing: -.01em; }
  .lede { max-width: 60ch; margin-top: 12px; opacity: .8; }
  .sheet { display: grid; grid-template-columns: repeat(5, 1fr); gap: 18px; margin-top: 40px; }
  .card h2 { font: 600 24px/1.1 Fraunces, serif; margin-top: 16px; }
  .card p { font-size: 14px; margin-top: 6px; opacity: .8; }
  .card .line { font-style: italic; opacity: 1; }
  .plate { border-radius: 14px; padding: 9%; aspect-ratio: 1; }
  .inks { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 6px; }
  .inks .plate { border-radius: 8px; padding: 10%; }
  @media (max-width: 900px) { .sheet { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 520px) { .sheet { grid-template-columns: 1fr; } }
</style>
<h1>Five names, five mascots</h1>
<p class="lede">Each mascot is one drawing with four colour slots, so every theme prints it in its own inks. The big tile is the neutral version; the four small ones are the same drawing in other themes' inks.</p>
<div class="sheet" id="sheet"></div>
<script src="names.js"></script>
<script>
  {
    const neutral = { bg: "#EFE6D4", ink: "#2A2420", fill: "#C56B4A", accent: "#E3A72F", paper: "#FBF6EA" };
    const inks = [
      { bg: "#23235B", ink: "#F2E8D5", fill: "#FF5A4E", accent: "#FFC43D", paper: "#23235B" },
      { bg: "#2F6F6A", ink: "#3B2618", fill: "#E8704A", accent: "#E9B949", paper: "#F3EAD8" },
      { bg: "#FFE3C2", ink: "#5B4370", fill: "#F29A9A", accent: "#F4B740", paper: "#FFF9EE" },
      { bg: "#E6E1CF", ink: "#2E4034", fill: "#8A9A7B", accent: "#B5562B", paper: "#F6F2E4" },
    ];
    document.getElementById("sheet").innerHTML = NAME_IDS.map((id) => {
      const n = NAMES[id];
      return `<article class="card">
        <div class="plate" style="background:${neutral.bg}">${n.mascot(neutral)}</div>
        <div class="inks">${inks.map((p) => `<div class="plate" style="background:${p.bg}">${n.mascot(p)}</div>`).join("")}</div>
        <h2>${n.name}</h2><p class="line">${n.line}</p><p>${n.local}</p></article>`;
    }).join("");
  }
</script>
</html>
