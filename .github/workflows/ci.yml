name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # --ignore-scripts is also set in .npmrc: no dependency runs code at install time
      - run: npm ci --ignore-scripts
      - run: npm audit signatures
      - run: npm run typecheck
      - run: npm run lint
      # the same tests, also counted into .ci/unit-tests.json for the back office
      - run: npm run test:ci
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      # Report what this run measured to /office. Main only; it runs even when a test failed, so a
      # failing count is posted as honestly as a passing one. Skips with a notice if the secret is unset.
      - name: Post figures to the back office
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('.ci/unit-tests.json') != '' }}
        run: node scripts/ci/post-facts.mjs
        env:
          INGEST_URL: https://sally-manders-coffee.vercel.app/api/ingest/ci
          CI_INGEST_SECRET: ${{ secrets.CI_INGEST_SECRET }}
