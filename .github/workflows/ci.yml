name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A pull request's newer push replaces its older run. Main's runs queue instead: cancelling one
# could stop a deploy halfway, with nobody watching the switch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # read-only: lets the security figures count open CodeQL alerts
      security-events: read
    steps:
      # the release gate reports how long verification took, from here to its verdict
      - name: Start the clock
        run: echo "GATE_STARTED_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # SonarCloud reads history to tell new code from old
          lfs: true # the renders and the e2e baselines live in Git LFS once scripts/adopt-lfs.sh has run
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # --ignore-scripts is also set in .npmrc: no dependency runs code at install time
      - run: npm ci --ignore-scripts
      - id: signatures
        run: npm audit signatures
      # Gate: a high or critical hole in anything that ships fails the build. Dev tooling is
      # counted on /office but doesn't block, since it never reaches a visitor.
      - name: No high-severity holes in shipped packages
        id: audit
        run: npm audit --omit=dev --audit-level=high
      - id: types
        run: npm run typecheck
      - id: lint
        run: npm run lint
      # the tests, counted into .ci/ (results, coverage and lcov) for the gate, SonarCloud and /office
      - id: tests
        run: npm run test:ci
      # Gate: coverage against the bar in scripts/ci/coverage-bar.mjs
      - name: Coverage gate
        id: coverage
        run: node scripts/ci/coverage-gate.mjs
      # Not a gate: the changed lines in lib/ and server/ that no test ran, from the coverage above
      # against the diff. A pull request gets them as one comment (the job below); main posts the
      # count to /office. On a pull request the checkout is GitHub's merge commit, so its first
      # parent is the base branch, and the links point at that merge commit, whose lines the diff counts.
      - name: Test gap
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        run: node scripts/ci/test-gap.mjs
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
          HEAD_URL_SHA: ${{ github.sha }}
      - name: Keep the test gap for the comment
        if: ${{ !cancelled() && github.event_name == 'pull_request' && hashFiles('test-gap/comment.md') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-gap
          path: test-gap/comment.md
          retention-days: 3
      - id: build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      # The browser tests run the build above with `next start`, on a fresh PGlite (LOCAL_DB in
      # playwright.config.ts), never on Neon. Chromium's headless shell is fetched here, on the
      # runner, from Playwright's own CDN; nothing is downloaded on a laptop.
      - name: Browser for the UI tests
        run: npx playwright install --with-deps --only-shell chromium
      # Gate: every browser test passes on desktop and phone, the barcode tests and the screenshot
      # baselines among them. The counts land in .ci/ui-tests.json, what the barcode tests read in
      # .ci/barcodes.json, and the baselines compared in .ci/parts/baselines.json (a part of the
      # "quality-gates" figure, not a figure of its own, so post-facts.mjs never posts it).
      - name: UI tests (Playwright, desktop and phone)
        id: ui
        run: npx playwright test
      # What a failed run saw: screenshots, traces, and each changed page's -actual.png and diff,
      # which is also how a meant change gets its new baseline (e2e/visual.spec.ts says how).
      - name: Keep the browser tests' evidence
        if: ${{ failure() && steps.ui.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-tests
          path: |
            test-results/
            playwright-report/
          retention-days: 14

      # SonarCloud runs once SONAR_TOKEN is set; until then (and on forks, which get no secrets) it skips.
      - name: Is SonarCloud set up?
        id: sonar
        run: echo "enabled=${{ secrets.SONAR_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      # Gate: sonar.qualitygate.wait in sonar-project.properties fails this step on a failed gate
      - name: SonarCloud scan
        id: sonarcloud
        if: steps.sonar.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # The verdict over every gate above, written to .ci/quality-gates.json and the run's summary.
      # Fails if any gate failed; the release-gate job below is the one name a merge waits for.
      - name: Release gate verdict
        if: ${{ !cancelled() }}
        run: node scripts/ci/release-gate.mjs
        env:
          GATES: >-
            [["package signatures", "${{ steps.signatures.outcome }}"],
            ["shipped-package audit", "${{ steps.audit.outcome }}"],
            ["types", "${{ steps.types.outcome }}"],
            ["lint", "${{ steps.lint.outcome }}"],
            ["unit and API tests", "${{ steps.tests.outcome }}"],
            ["coverage", "${{ steps.coverage.outcome }}"],
            ["build", "${{ steps.build.outcome }}"],
            ["browser tests and baselines", "${{ steps.ui.outcome }}"],
            ["SonarCloud", "${{ steps.sonarcloud.outcome }}"]]

      # Report what this run measured to /office. Main only; these run even when a gate failed, so a
      # failing figure is posted as honestly as a passing one.
      - name: Export benchmark (90 days streamed, reopened and checked)
        run: node --expose-gc --import tsx scripts/ci/export-facts.ts
      - name: Boundary figures (the lint rule's check, over every import)
        if: ${{ !cancelled() }}
        run: node scripts/ci/boundary-facts.mjs
      - name: Security figures
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: node scripts/ci/security-facts.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SONAR_PROJECT_KEY: SKMinWoo_sally-manders-coffee
      # posted by post-checks once production runs this commit, so a new kind of figure finds code
      # that knows it
      - name: Keep the figures for the back office
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('.ci/unit-tests.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-facts
          path: .ci/*.json
          retention-days: 3

  # The release gate: green only when every gate in check passed. It's the one check a pull request
  # needs before it can merge, and so before main, which is what production deploys from.
  release-gate:
    name: Release gate
    needs: check
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every gate in check passed
        run: test "$CHECK" = success
        env:
          CHECK: ${{ needs.check.result }}

  # Production, from main only (ADR 0007): every migration checked as expand-only, then applied,
  # then the build switched in through Vercel's deploy hook while a probe watches, then a smoke test
  # of the live site. Main's own Git deploys are off in vercel.json, so this is the one way in.
  deploy:
    name: Deploy to production
    needs: release-gate
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release-gate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # the secrets live in this environment, which only main may deploy from
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Every migration only expands the schema
        run: node scripts/ci/expand-only.mjs
      - name: Migrate production
        run: node scripts/deploy/migrate.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Deploy, probe the switch, smoke-test the live site
        run: node scripts/deploy/ship.mjs
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
      - name: Post the deploy to the back office
        if: ${{ !cancelled() && hashFiles('.ci/deploy.json') != '' }}
        run: node scripts/ci/post-facts.mjs
        env:
          INGEST_URL: https://sally-manders-coffee.vercel.app/api/ingest/ci
          CI_INGEST_SECRET: ${{ secrets.CI_INGEST_SECRET }}

  # The check job's figures, posted once the deploy is done, or skipped because a gate failed (then
  # the build already live is the right one). Failing figures are posted as honestly as passing ones.
  post-checks:
    name: Post the checks
    needs: [check, deploy]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.check.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ci
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: check-facts
          path: .ci
      - name: Post figures to the back office
        run: node scripts/ci/post-facts.mjs
        env:
          INGEST_URL: https://sally-manders-coffee.vercel.app/api/ingest/ci
          CI_INGEST_SECRET: ${{ secrets.CI_INGEST_SECRET }}

  # The test gap, posted on the pull request as one comment that each push edits rather than adds
  # to. It's its own job so that only this one can write to the pull request, and it runs no code
  # from the change: it only posts the markdown check wrote. Forks get a read-only token, so not there.
  test-gap-comment:
    name: Test gap comment
    needs: check
    if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: write
    steps:
      - id: get
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true # no artifact when the tests failed before the gap was measured
        with:
          name: test-gap
      - name: Post or update the comment
        if: ${{ steps.get.outcome == 'success' }}
        run: gh pr comment "$PR" --repo "$REPO" --body-file comment.md --edit-last --create-if-none
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}

  # Exhibit 7: JMeter against the built app on `next start` and a Postgres with a month of the shop
  # in it, reached over HTTP through Neon's own proxy as production reaches Neon (docs/decisions/0006).
  # Not a gate: the figures are posted as measured. This job runs a community proxy image, so it holds
  # no secrets; the job after it posts the figure and runs no image.
  load-test:
    name: Load test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres@sha256:005c5c37db96c1e6652a79ea31f9886402fba81ac95dc2db897739121dd7f8f2 # 17-alpine, linux/amd64
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres # a throwaway container on the runner, not a secret
          POSTGRES_DB: main
        options: >-
          --health-cmd "pg_isready -U postgres -d main"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:postgres@db.localtest.me:5432/main
      # the shop held at one moment, so every run seeds and reads the same month
      SHOP_FROZEN_AT: "2026-11-13T19:30:00Z"
      LOAD_DAY: "2026-11-12"
      LOAD_FROM: "2026-11-06"
      USERS: "20"
      PER_MINUTE: "6000"
      SECONDS_UNDER_LOAD: "180"
      JMETER_VERSION: "5.6.3"
      # from https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz.sha512
      JMETER_SHA512: 5978a1a35edb5a7d428e270564ff49d2b1b257a65e17a759d259a9283fc17093e522fe46f474a043864aea6910683486340706d745fcdf3db1505fd71e689083
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      # Started here rather than as a service: its start script creates a table in Postgres, so it
      # must come up after Postgres is healthy, which services don't promise. Read before trusting:
      # Neon's proxy binary built from neondatabase/neon (release-proxy-8853), with Caddy in front.
      # At that release the proxy pools HTTP connections only for clients that send
      # Neon-Pool-Opt-In, and @neondatabase/serverless never does, so as shipped every query opened
      # and closed its own Postgres connection, and the runs hit Postgres's 100 (docs/decisions/0006).
      # The start script is edited to pool for every client, as a pooling Neon does; the run fails
      # here if that edit stops matching.
      - name: Neon's proxy in front of Postgres
        run: |
          echo "127.0.0.1 db.localtest.me" | sudo tee -a /etc/hosts
          docker run -d --name neon-proxy --network "$NET" -p 4444:4444 \
            -e PG_CONNECTION_STRING=postgres://postgres:postgres@postgres:5432/main \
            --entrypoint bash \
            ghcr.io/timowilhelm/local-neon-http-proxy@sha256:5730d368cd26f29fc77309fc7ea8e31d1b3bdc6648afc445136e900700384918 \
            -c "sed -i 's/--auth-backend=postgres/--sql-over-http-pool-opt-in=false --auth-backend=postgres/' start.sh && grep -q pool-opt-in=false start.sh && exec ./start.sh"
          sleep 3
          docker inspect -f '{{.State.Running}}' neon-proxy | grep -qx true || { docker logs neon-proxy; exit 1; }
        env:
          NET: ${{ job.services.postgres.network }}
      - name: Seed a month of the shop (migrations, days, a brief)
        run: npx tsx scripts/load/prepare.ts
      - run: npm run build
      - name: Cache JMeter
        id: jmeter-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/jmeter
          key: jmeter-${{ env.JMETER_VERSION }}-${{ env.JMETER_SHA512 }}
      - name: JMeter, from Apache, checked against its SHA-512
        if: steps.jmeter-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/jmeter.tgz" "https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-$JMETER_VERSION.tgz"
          echo "$JMETER_SHA512  $RUNNER_TEMP/jmeter.tgz" | sha512sum -c -
          mkdir -p ~/jmeter && tar -xzf "$RUNNER_TEMP/jmeter.tgz" -C ~/jmeter --strip-components=1
      - name: Start the shop, and read each page once
        run: |
          mkdir -p load-results
          npx next start -p 3000 > load-results/next.log 2>&1 &
          for i in $(seq 60); do curl -fs -o /dev/null localhost:3000/api/v1/health && break; sleep 1; done
          # one read of each, so the run measures warm pages rather than the first request's cache fill
          for p in / /order /behind /office /docs /api/v1/health /api/v1/menu "/api/v1/days/$LOAD_DAY" \
            "/api/v1/days/$LOAD_DAY/hours" "/api/v1/days/$LOAD_DAY/items" /api/v1/brief /api/v1/engineering \
            "/api/v1/exports/sales?from=$LOAD_FROM&to=$LOAD_DAY"; do
            curl -fs -o /dev/null -w "%{http_code} %{time_total}s $p\n" "localhost:3000$p"
          done
      # Once a second through the run: how many connections Postgres holds for clients (the proxy's
      # included, this sampler's own not), and its limit. Read in the step summary as the peak.
      - name: Count Postgres's connections in the background
        run: |
          (while true; do
            docker exec "$PG" psql -U postgres -d main -Atc "select now()::time(0), count(*) filter (where backend_type = 'client backend' and pid <> pg_backend_pid()), current_setting('max_connections') from pg_stat_activity" >> load-results/connections.txt 2>/dev/null
            sleep 1
          done) &
        env:
          PG: ${{ job.services.postgres.id }}
      - name: Load test (JMeter)
        run: >-
          ~/jmeter/bin/jmeter -n -t load/shop.jmx
          -l load-results/results.jtl -e -o load-results/report
          -Jusers="$USERS" -JperMinute="$PER_MINUTE" -Jseconds="$SECONDS_UNDER_LOAD"
          -Jday="$LOAD_DAY" -Jfrom="$LOAD_FROM"
      - name: Peak Postgres connections
        if: ${{ !cancelled() }}
        run: >-
          awk -F'|' '$2 > peak { peak = $2 } { limit = $3 }
          END { printf "Postgres client connections: peak %d of %d allowed, over %d one-second samples\n", peak, limit, NR }'
          load-results/connections.txt | tee -a "$GITHUB_STEP_SUMMARY"
      - name: P95 by endpoint
        run: node scripts/ci/load-facts.mjs
      # JMeter's own dashboard, the raw results and the server's log: Grafana's part, kept per run
      - name: Keep JMeter's report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: load-report
          path: load-results/
          retention-days: 14
      - name: Keep the figure for the back office
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: load-facts
          path: .ci/load-test.json
          retention-days: 3
      # off the service network before the runner takes it down, or the teardown can't remove it
      - name: Stop Neon's proxy
        if: ${{ always() }}
        run: docker rm -f neon-proxy || true

  # Posts the load test's figure from main. Its own job so the secret never shares a runner with the
  # proxy image; it runs only the repository's own post script.
  load-test-post:
    name: Post the load test
    needs: [load-test, deploy]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.load-test.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ci
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: load-facts
          path: .ci
      - name: Post figures to the back office
        run: node scripts/ci/post-facts.mjs
        env:
          INGEST_URL: https://sally-manders-coffee.vercel.app/api/ingest/ci
          CI_INGEST_SECRET: ${{ secrets.CI_INGEST_SECRET }}

  # Exhibit 11 (ADR 0008): the shop on Kubernetes. A throwaway kind cluster, Argo CD installed in it,
  # and the Helm chart in deploy/chart synced from GitHub at this commit, with the images built here.
  # Then health, asked through the shop's Service, must be ok and name this commit. Not a release
  # gate: the cluster isn't production. It runs community and upstream images, so it holds no
  # secrets; the job after it posts the figure.
  cluster:
    name: Kubernetes (kind, Argo CD, Helm)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # the commit under test: a pull request's own head, which Argo CD can fetch from GitHub
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      KIND_VERSION: v0.33.0
      # from the release's kind-linux-amd64.sha256sum
      KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
      KIND_NODE: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
      ARGOCD_VERSION: v3.5.7
      # sha256 of manifests/install.yaml at the v3.5.7 tag, taken when this job was written
      ARGOCD_SHA256: 09bfbb9041b4a8503c6e4fa22cf41c403fa62be17526de353648a4551f5beb77
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: kind, checked against its SHA-256
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/kind" "https://github.com/kubernetes-sigs/kind/releases/download/$KIND_VERSION/kind-linux-amd64"
          echo "$KIND_SHA256  $RUNNER_TEMP/kind" | sha256sum -c -
          sudo install -m 0755 "$RUNNER_TEMP/kind" /usr/local/bin/kind
      - name: A throwaway cluster
        run: kind create cluster --name shop --image "$KIND_NODE" --config deploy/kind.yaml --wait 120s
      - name: Argo CD, checked against its SHA-256
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/argocd.yaml" "https://raw.githubusercontent.com/argoproj/argo-cd/$ARGOCD_VERSION/manifests/install.yaml"
          echo "$ARGOCD_SHA256  $RUNNER_TEMP/argocd.yaml" | sha256sum -c -
          kubectl create namespace argocd
          # server-side: Argo CD's CRDs are too large for the annotation a client-side apply writes
          kubectl apply -n argocd --server-side --force-conflicts -f "$RUNNER_TEMP/argocd.yaml"
      # built while Argo CD's pods start; kind's node gets them straight from the runner's Docker
      - name: The shop's images, from this commit
        run: |
          docker build --target runner --build-arg GIT_COMMIT_SHA="$SHA" -t "sally-manders:$SHA" .
          docker build --target tools -t "sally-manders-tools:$SHA" .
          kind load docker-image --name shop "sally-manders:$SHA" "sally-manders-tools:$SHA"
      - name: Wait for Argo CD
        run: |
          kubectl -n argocd rollout status deploy/argocd-redis --timeout=300s
          kubectl -n argocd rollout status deploy/argocd-repo-server --timeout=300s
          kubectl -n argocd rollout status statefulset/argocd-application-controller --timeout=300s
      - name: Sync the chart at this commit, timed to Synced and Healthy
        run: |
          mkdir -p cluster-results
          yq '.spec.source.targetRevision = strenv(SHA) | .spec.source.helm.parameters[0].value = strenv(SHA)' \
            deploy/argocd/application.yaml > cluster-results/application.yaml
          start=$(date +%s%3N)
          kubectl apply -f cluster-results/application.yaml
          last=""
          for i in $(seq 300); do
            state=$(kubectl -n argocd get application sally-manders \
              -o jsonpath='{.status.sync.status} {.status.health.status} {.status.operationState.phase} {.status.sync.revision}')
            if [ "$state" != "$last" ]; then echo "$(( ($(date +%s%3N) - start) / 1000 )) s: $state"; last=$state; fi
            if [ "$state" = "Synced Healthy Succeeded $SHA" ]; then
              echo "SYNC_MS=$(( $(date +%s%3N) - start ))" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Argo CD didn't get the chart to Synced and Healthy in 10 minutes"
          exit 1
      - name: Ask the shop's health through its Service
        run: |
          for i in $(seq 30); do curl -fsS -o cluster-results/health.json http://127.0.0.1:8080/api/v1/health && break; sleep 2; done
          cat cluster-results/health.json; echo
          kubectl -n argocd get application sally-manders -o json > cluster-results/app.json
          kubectl -n shop get pods -o json > cluster-results/pods.json
          kubectl -n shop get pods -o wide
      - name: The cluster's figure
        run: node scripts/ci/cluster-facts.mjs
      - name: What the cluster said
        if: ${{ failure() }}
        run: |
          kubectl -n argocd get application sally-manders -o yaml || true
          kubectl get pods -A -o wide || true
          kubectl -n shop describe pods || true
          kubectl -n shop get events --sort-by=.lastTimestamp || true
          for d in postgres neon-proxy shop; do echo "== $d"; kubectl -n shop logs "deploy/$d" --all-containers --tail=100 || true; done
          echo "== seed"; kubectl -n shop logs job/seed --tail=200 || true
          kubectl -n argocd logs deploy/argocd-repo-server --tail=100 || true
          kubectl -n argocd logs statefulset/argocd-application-controller --tail=100 || true
      - name: Keep what the cluster said
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cluster-results
          path: cluster-results/
          if-no-files-found: ignore
          retention-days: 14
      # a failing figure is posted as honestly as a passing one
      - name: Keep the figure for the back office
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('.ci/cluster.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cluster-facts
          path: .ci/cluster.json
          retention-days: 3

  # Posts the cluster's figure from main, once the deploy is done. Its own job so the secret never
  # shares a runner with the cluster's images; it runs only the repository's own post script.
  cluster-post:
    name: Post the cluster
    needs: [cluster, deploy]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.cluster.result == 'success' || needs.cluster.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ci
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: get
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true # none when the cluster failed before it had a figure
        with:
          name: cluster-facts
          path: .ci
      - name: Post figures to the back office
        if: ${{ steps.get.outcome == 'success' }}
        run: node scripts/ci/post-facts.mjs
        env:
          INGEST_URL: https://sally-manders-coffee.vercel.app/api/ingest/ci
          CI_INGEST_SECRET: ${{ secrets.CI_INGEST_SECRET }}
