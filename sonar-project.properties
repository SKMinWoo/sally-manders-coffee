# SonarCloud, run from CI (.github/workflows/ci.yml) once SONAR_TOKEN is set.
# Automatic Analysis must be off in SonarCloud's project settings, or the two runs clash.
sonar.organization=skminwoo
sonar.projectKey=SKMinWoo_sally-manders-coffee

sonar.sources=app,lib,server,scripts
sonar.tests=app,lib,server
sonar.test.inclusions=**/*.test.ts
sonar.exclusions=**/*.test.ts

# the lcov file `npm run test:ci` writes
sonar.javascript.lcov.reportPaths=.ci/lcov.info

# wait for the quality gate, and fail the CI step when it fails
sonar.qualitygate.wait=true
